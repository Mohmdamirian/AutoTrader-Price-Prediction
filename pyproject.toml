[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader-price-prediction"
version = "1.0.0"
description = "Vehicle price prediction from classical ML baselines to explainable ensembles"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Mohammad Amirian"}
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
notebooks = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "xgboost>=2.0,<4",
  "shap>=0.46,<1",
  "jupyterlab>=4,<5",
]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
